  <circle cx="60" cy="60" r="53" fill="url(#medallion)" stroke="url(#rim)" stroke-width="3.5"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="url(#rim)" stroke-width="1.2" opacity="0.55"/>

